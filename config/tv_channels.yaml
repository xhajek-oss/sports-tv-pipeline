idnes:
  timezone: Europe/Prague
  max_pages_per_query: 5

  # Primary discovery walks the concrete TV channel programme pages so we do
  # not depend on iDNES search pagination to discover broadcasts.
  crawl_channels:
    - ct-1
    - ct-2
    - ct-4-sport
    - eurosport
    - eurosport-2
    - nova-sport
    - nova-sport-2
    - nova-sport-3
    - nova-sport-4
    - nova-sport-5
    - nova-sport-6
    - oneplaysport-1
    - oneplaysport-2
    - oneplaysport-3
    - oneplaysport-4
    - premier-sport
    - premier-sport-2
    - premier-sport-3
    - sport1
    - sport2
    - prima-sport

  # Search terms define which sports are retained from the channel schedules.
  # Search crawling remains available as a fallback for compatibility/debugging.
  search_queries:
    - atletika
    - biatlon
    - hokej

  # iDNES channel slug (from URL) -> canonical channel name.
  # ČT sport Plus is NOT here: it is an online-only ČT source and will use the ČT scraper.
  channels:
    ct-1: "ČT1"
    ct-2: "ČT2"
    ct-4-sport: "ČT sport"
    eurosport: "Eurosport 1"
    eurosport-2: "Eurosport 2"
    nova-sport: "Nova Sport 1"
    nova-sport-2: "Nova Sport 2"
    nova-sport-3: "Nova Sport 3"
    nova-sport-4: "Nova Sport 4"
    nova-sport-5: "Nova Sport 5"
    nova-sport-6: "Nova Sport 6"
    oneplaysport-1: "Oneplay Sport 1"
    oneplaysport-2: "Oneplay Sport 2"
    oneplaysport-3: "Oneplay Sport 3"
    oneplaysport-4: "Oneplay Sport 4"
    premier-sport: "Premier Sport 1"
    premier-sport-2: "Premier Sport 2"
    premier-sport-3: "Premier Sport 3"
    # Current iDNES programme detail URLs use sport1/sport2. Keep the older
    # hyphenated aliases too so older/cached pages remain compatible.
    sport1: "Sport1"
    sport2: "Sport2"
    sport-1: "Sport1"
    sport-2: "Sport2"
    prima-sport: "Prima Sport"
