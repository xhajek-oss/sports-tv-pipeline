name: Debug Source

on:
  workflow_dispatch:
    inputs:
      source:
        description: Source to diagnose
        required: true
        default: idnes
        type: choice
        options:
          - idnes
          - czechathletics_youtube
          - atletika_cz
          - hcdynamo
          - biathlonworld
          - iihf
          - diamondleague
          - worldathletics

jobs:
  debug:
    uses: ./.github/workflows/_pipeline.yml
    with:
      mode: debug
      source: ${{ inputs.source }}
    secrets: inherit
