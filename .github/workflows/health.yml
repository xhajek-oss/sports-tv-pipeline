name: Health Check

on:
  workflow_dispatch:
    inputs:
      simulate_down:
        description: 'Send a simulated DOWN alert to Telegram'
        required: false
        default: false
        type: boolean

jobs:
  health:
    uses: ./.github/workflows/_pipeline.yml
    with:
      mode: health
      source: all
      simulate_down: ${{ inputs.simulate_down }}
    secrets: inherit
