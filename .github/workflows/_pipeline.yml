name: Shared Pipeline

on:
  workflow_call:
    inputs:
      mode:
        required: true
        type: string
      source:
        required: false
        default: all
        type: string

jobs:
  run:
    runs-on: ubuntu-latest
    concurrency:
      group: pipeline-${{ inputs.mode }}-${{ inputs.source }}
      cancel-in-progress: ${{ inputs.mode != 'production' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore validation state
        if: inputs.mode == 'production'
        uses: actions/cache/restore@v4
        with:
          path: data/validation_state.json
          key: validation-state-${{ github.run_id }}
          restore-keys: |
            validation-state-

      - name: Restore production database
        if: inputs.mode == 'production' || inputs.mode == 'digest' || inputs.mode == 'weekly'
        uses: actions/cache/restore@v4
        with:
          path: |
            data/sports_events.db
            data/production_snapshot.json
          key: production-db-${{ github.run_id }}
          restore-keys: |
            production-db-

      - name: Reject stale production database
        if: inputs.mode == 'digest' || inputs.mode == 'weekly'
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
        run: |
          if [[ ! -f data/sports_events.db || ! -f data/production_snapshot.json ]]; then
            echo "Successful Production snapshot is missing; refusing to send ${MODE}."
            exit 1
          fi

          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          meta = json.loads(Path('data/production_snapshot.json').read_text(encoding='utf-8'))
          completed_at = datetime.fromisoformat(meta['completed_at'].replace('Z', '+00:00'))
          age = datetime.now(timezone.utc) - completed_at.astimezone(timezone.utc)
          max_age_seconds = 8 * 60 * 60
          print(f"Production snapshot run_id={meta.get('run_id')} age={int(age.total_seconds())}s limit={max_age_seconds}s")
          if age.total_seconds() > max_age_seconds:
              raise SystemExit(f"Production snapshot is stale; refusing to send {os.environ['MODE']}.")
          PY

      - name: Restore health state
        if: inputs.mode == 'health'
        uses: actions/cache/restore@v4
        with:
          path: data/health_state.json
          key: health-state-${{ github.run_id }}
          restore-keys: |
            health-state-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run full test suite
        if: inputs.mode == 'pr'
        run: |
          pytest -q
          python runner.py --mode pr

      - name: Run pipeline
        if: inputs.mode != 'pr'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_HEALTH_CHAT_ID: ${{ secrets.TELEGRAM_HEALTH_CHAT_ID }}
          TELEGRAM_DIGEST_CHAT_ID: ${{ secrets.TELEGRAM_DIGEST_CHAT_ID }}
        run: python runner.py --mode '${{ inputs.mode }}' --source '${{ inputs.source }}'

      - name: Mark successful production snapshot
        if: success() && inputs.mode == 'production'
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          Path('data').mkdir(parents=True, exist_ok=True)
          Path('data/production_snapshot.json').write_text(
              json.dumps(
                  {
                      'run_id': os.environ['GITHUB_RUN_ID'],
                      'commit': os.environ['GITHUB_SHA'],
                      'completed_at': datetime.now(timezone.utc).isoformat(),
                      'status': 'success',
                  },
                  ensure_ascii=False,
                  indent=2,
              ) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Save validation state
        if: always() && inputs.mode == 'production'
        uses: actions/cache/save@v4
        with:
          path: data/validation_state.json
          key: validation-state-${{ github.run_id }}

      - name: Save production database
        if: success() && inputs.mode == 'production'
        uses: actions/cache/save@v4
        with:
          path: |
            data/sports_events.db
            data/production_snapshot.json
          key: production-db-${{ github.run_id }}

      - name: Save health state
        if: always() && inputs.mode == 'health'
        uses: actions/cache/save@v4
        with:
          path: data/health_state.json
          key: health-state-${{ github.run_id }}

      - name: Upload production database
        if: always() && inputs.mode == 'production'
        uses: actions/upload-artifact@v4
        with:
          name: sports-events-db
          path: data/sports_events.db
          if-no-files-found: warn

      - name: Upload debug artifacts
        if: always() && inputs.mode == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ inputs.source }}
          path: artifacts/debug
          if-no-files-found: warn
