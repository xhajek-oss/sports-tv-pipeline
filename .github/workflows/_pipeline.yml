name: Shared Pipeline

on:
  workflow_call:
    inputs:
      mode:
        required: true
        type: string
      source:
        required: false
        default: all
        type: string

jobs:
  run:
    runs-on: ubuntu-latest
    concurrency:
      group: pipeline-${{ inputs.mode }}-${{ inputs.source }}
      cancel-in-progress: ${{ inputs.mode != 'production' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore validation state
        if: inputs.mode == 'production'
        uses: actions/cache/restore@v4
        with:
          path: data/validation_state.json
          key: validation-state-${{ github.run_id }}
          restore-keys: |
            validation-state-

      - name: Restore production database
        if: inputs.mode == 'production' || inputs.mode == 'digest' || inputs.mode == 'weekly'
        uses: actions/cache/restore@v4
        with:
          path: data/sports_events.db
          key: production-db-${{ github.run_id }}
          restore-keys: |
            production-db-

      - name: Reject stale production database
        if: inputs.mode == 'digest' || inputs.mode == 'weekly'
        shell: bash
        run: |
          if [[ ! -f data/sports_events.db ]]; then
            echo "Production database is missing; refusing to send ${MODE}."
            exit 1
          fi

          now_epoch=$(date +%s)
          db_epoch=$(stat -c %Y data/sports_events.db)
          age_seconds=$((now_epoch - db_epoch))
          max_age_seconds=$((8 * 60 * 60))
          echo "Production database age: ${age_seconds}s (limit ${max_age_seconds}s)"

          if (( age_seconds > max_age_seconds )); then
            echo "Production database is stale; refusing to send ${MODE}."
            exit 1
          fi
        env:
          MODE: ${{ inputs.mode }}

      - name: Restore health state
        if: inputs.mode == 'health'
        uses: actions/cache/restore@v4
        with:
          path: data/health_state.json
          key: health-state-${{ github.run_id }}
          restore-keys: |
            health-state-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run full test suite
        if: inputs.mode == 'pr'
        run: |
          pytest -q
          python runner.py --mode pr

      - name: Run pipeline
        if: inputs.mode != 'pr'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_HEALTH_CHAT_ID: ${{ secrets.TELEGRAM_HEALTH_CHAT_ID }}
          TELEGRAM_DIGEST_CHAT_ID: ${{ secrets.TELEGRAM_DIGEST_CHAT_ID }}
        run: python runner.py --mode '${{ inputs.mode }}' --source '${{ inputs.source }}'

      - name: Mark production database fresh
        if: success() && inputs.mode == 'production'
        run: touch data/sports_events.db

      - name: Save validation state
        if: always() && inputs.mode == 'production'
        uses: actions/cache/save@v4
        with:
          path: data/validation_state.json
          key: validation-state-${{ github.run_id }}

      - name: Save production database
        if: always() && inputs.mode == 'production'
        uses: actions/cache/save@v4
        with:
          path: data/sports_events.db
          key: production-db-${{ github.run_id }}

      - name: Save health state
        if: always() && inputs.mode == 'health'
        uses: actions/cache/save@v4
        with:
          path: data/health_state.json
          key: health-state-${{ github.run_id }}

      - name: Upload production database
        if: always() && inputs.mode == 'production'
        uses: actions/upload-artifact@v4
        with:
          name: sports-events-db
          path: data/sports_events.db
          if-no-files-found: warn

      - name: Upload debug artifacts
        if: always() && inputs.mode == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ inputs.source }}
          path: artifacts/debug
          if-no-files-found: warn
