name: Bootstrap Level 5 Import

on:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  SOURCE_REPO: https://github.com/xhajek-oss/YT_Michopulos.git
  SOURCE_REF: feature/idnes-tv

jobs:
  import:
    if: github.event.head_commit.message != 'Import Level 5 snapshot'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone verified source snapshot
        run: |
          git clone --depth 1 --branch "$SOURCE_REF" "$SOURCE_REPO" /tmp/source

      - name: Import clean Level 5 runtime
        run: |
          rm -rf app config docs matching models monitoring scrapers storage validation tests data
          rm -f runner.py requirements.txt .gitignore

          cp -R /tmp/source/app .
          cp -R /tmp/source/config .
          cp -R /tmp/source/docs .
          cp -R /tmp/source/matching .
          cp -R /tmp/source/models .
          cp -R /tmp/source/monitoring .
          cp -R /tmp/source/scrapers .
          cp -R /tmp/source/storage .
          cp -R /tmp/source/validation .
          cp -R /tmp/source/tests .
          mkdir -p data
          touch data/.gitkeep

          cp /tmp/source/runner.py .
          cp /tmp/source/requirements.txt .
          cp /tmp/source/.gitignore .

          rm -f \
            tests/test_diamondleague.py \
            tests/test_diamondleague_regex.py \
            tests/test_diamondleague_time.py

          cat > README.md <<'EOF'
          # sports-tv-pipeline

          Resilient Level 5 sports and TV data pipeline.

          The project uses one shared Python core and one common runner with four operating modes:
          `pr`, `health`, `production`, and `debug`.

          - PR checks run the complete test suite without scraping external sites.
          - Health checks monitor each source and can send Telegram DOWN/RECOVERED notifications.
          - Production restores the previous SQLite database, isolates failed sources, validates data, and runs TV matching.
          - Debug runs one source and uploads parsed/error artifacts for diagnosis.

          See `docs/architecture.md` for architecture and operating details.

          ## Telegram

          Configure these repository secrets to enable health notifications:

          - `TELEGRAM_BOT_TOKEN`
          - `TELEGRAM_CHAT_ID`
          EOF

      - name: Commit imported snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Level 5 snapshot"
          git push origin main
